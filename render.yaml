# Render Blueprint: one web service that serves both the API and the website.
services:
  - type: web
    name: rebin
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: START_ML
        value: "false"          # the image-classification service needs Python + PyTorch (too large for the free plan)
      - key: MONGO_URI
        sync: false             # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true     # Render creates a strong random secret for you
      - key: GOOGLE_CLIENT_ID
        sync: false
